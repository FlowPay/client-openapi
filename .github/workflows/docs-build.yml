name: Docs Build

on:
  push:
    paths:
      - "docs/**"
      - ".github/workflows/docs-build.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs-build.yml"

jobs:
  build:
    name: Reusable Docs Build
    uses: FlowPay/ci-templates/.github/workflows/backend-docs.yml@main
    secrets: inherit
